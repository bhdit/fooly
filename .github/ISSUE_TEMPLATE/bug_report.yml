name: Bug report
description: Something in an SDK, the protocol or the hosted service doesn't work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Never paste** what a person typed, a `poll_secret`, private keys or anyone's personal data. Publishable keys (`pk_…`) are fine.
        Security problems go to fooly@bhdit.com instead (see SECURITY.md).
  - type: dropdown
    id: client
    attributes:
      label: Client
      options:
        - JavaScript SDK (Tizen, webOS, WebView, browser)
        - Swift client (tvOS, iOS, macOS)
        - Kotlin client (Android TV, Google TV, Fire TV)
        - My own HTTP implementation
        - Phone page (what people see after scanning)
        - Developer dashboard
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: TV platform and version
      placeholder: e.g. Samsung Tizen 6.5, LG webOS 22, Android TV 12, tvOS 18
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a session with these fields: …
        2. Scan the code on an iPhone with Safari
        3. …
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error codes or logs
      description: The `error` code from the API or `err.code` from the SDK helps most. Remove any typed values first.
      render: text
